<section class="overlay hidden ui" id="audio_overlay"><div class="panel panel--strong settings-panel" role="dialog" aria-modal="true" aria-labelledby="audio_title"><div class="settings-head"><h2 class="h-panel" id="audio_title">Settings</h2><button type="button" class="btn btn-sm" id="close_audio" title="Close settings (Escape)"><span>Close</span><span class="key">Esc</span></button></div><div class="settings-rows"><div class="settings-row"><span>Music</span><div class="seg" data-setting="music"><button type="button" data-value="on">On</button><button type="button" data-value="off">Off</button></div></div><div class="settings-row"><span>Sound</span><div class="seg" data-setting="sound"><button type="button" data-value="on">On</button><button type="button" data-value="off">Off</button></div></div><div class="settings-row"><span>Ships</span><div class="seg" data-setting="ships"><button type="button" data-value="3d">3D</button><button type="button" data-value="flat">Flat</button></div></div><div class="settings-row"><span>View</span><div class="seg" data-setting="view"><button type="button" data-value="rendered">Rendered</button><button type="button" data-value="wireframe">Wireframe</button><button type="button" data-value="cockpit">Cockpit</button></div></div><div class="settings-row"><span>Effects</span><div class="seg" data-setting="effects"><button type="button" data-value="on">On</button><button type="button" data-value="off">Off</button></div></div><div class="settings-row"><span>Fullscreen</span><button type="button" class="btn btn-sm" id="settings_fullscreen"><span>Enter</span><span class="key">F11</span></button></div></div><details class="settings-mix"><summary>Volume</summary><label class="volume-control" for="master_volume"><span class="volume-heading"><span>Master volume</span><output id="master_volume_value" for="master_volume">100%</output></span><input id="master_volume" type="range" min="0" max="200" step="5" value="100"><small>Adjust the overall level, with extra gain up to 200%.</small></label><label class="volume-control" for="music_volume"><span class="volume-heading"><span>Music</span><output id="music_volume_value" for="music_volume">80%</output></span><input id="music_volume" type="range" min="0" max="100" step="5" value="80"><small>Slow world themes, spatial harmonies and adaptive combat rhythm.</small></label><label class="volume-control" for="effects_volume"><span class="volume-heading"><span>Sound effects</span><output id="effects_volume_value" for="effects_volume">100%</output></span><input id="effects_volume" type="range" min="0" max="100" step="5" value="100"><small>Engines, weapons, impacts, pickups, gates and warning cues.</small></label><label class="volume-control" for="ambience_volume"><span class="volume-heading"><span>Flight ambience</span><output id="ambience_volume_value" for="ambience_volume">70%</output></span><input id="ambience_volume" type="range" min="0" max="100" step="5" value="70"><small>Reactor hum and the surrounding atmosphere of each world.</small></label><div class="settings-mix-actions"><button type="button" class="btn btn-sm" id="test_audio"><span>Test the mix</span></button><button type="button" class="btn btn-sm btn-ghost" id="reset_audio"><span>Restore defaults</span></button></div></details><p class="small" id="audio_state"></p><p class="small">Changes apply at once and are kept for your next flight. M turns the sound on or off.</p></div></section>
