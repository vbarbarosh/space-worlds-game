<path d="M26 31.4 L26 40.4 M40 31.4 L40 40.4" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>
<circle cx="15.2" cy="35.6" r="1.6" fill="#2b3440" stroke="none"/><circle cx="48.8" cy="35.6" r="1.6" fill="#2b3440" stroke="none"/>
</g>
