<path d="M14.2 22.4 L32 19.6 L49.8 22.4 L49.4 24.1 L32 21.5 L14.6 24.1 Z" fill="#ffffff" fill-opacity="0.75" stroke="none"/>
<path d="M11.8 40.6 L52.2 40.6 L52.5 42.6 L11.5 42.6 Z" fill="#0a0f16" fill-opacity="0.3" stroke="none"/>
<!-- the seams of its three tiles, two bolts -->
