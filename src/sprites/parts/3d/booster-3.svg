<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
<linearGradient id="accent-fill" x1="0" y1="0" x2="1" y2="1"><stop id="accent-light" offset="0" stop-color="#ffa36b"/><stop id="accent-base" offset="0.55" stop-color="#e8743b"/><stop id="accent-dark" offset="1" stop-color="#9c4119"/></linearGradient>
<linearGradient id="house" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f7a87"/><stop offset="0.45" stop-color="#394350"/><stop offset="1" stop-color="#171c23"/></linearGradient>
<linearGradient id="bell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef2f6"/><stop offset="0.3" stop-color="#b3bdc8"/><stop offset="0.7" stop-color="#6b7684"/><stop offset="1" stop-color="#353e49"/></linearGradient>
<linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0.3" stop-color="#8a5a3a" stop-opacity="0"/><stop offset="1" stop-color="#7a4a2c" stop-opacity="0.85"/></linearGradient>
<radialGradient id="fire" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff1cf"/><stop offset="0.4" stop-color="#ffab52"/><stop offset="1" stop-color="#b3431c"/></radialGradient>
<linearGradient id="vane-l" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe5ec"/><stop offset="1" stop-color="#7b8795"/></linearGradient>
<linearGradient id="vane-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d99a6"/><stop offset="1" stop-color="#39434e"/></linearGradient>
</defs>
<g id="base" stroke="#10151c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<!-- a vane each side -->
<path d="M15 34 L7 46 L8 52 L14 46 Z" fill="url(#vane-l)"/>
<path d="M49 34 L57 46 L56 52 L50 46 Z" fill="url(#vane-r)"/>
<path d="M13.8 37.4 L8.4 45.6" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
<!-- a fuel injector each side, its mouth to the nose -->
<path d="M16 12 L12 12 L11 22 L17 22 Z M48 12 L52 12 L53 22 L47 22 Z" fill="url(#house)" stroke-width="2"/>
<path d="M12.7 12.2 L15.3 12.2 M48.7 12.2 L51.3 12.2" fill="none" stroke="#8d99a6" stroke-width="1"/>
<!-- the housing: its lip, a rib -->
<path d="M17 20 L47 20 L49 34 L15 34 Z" fill="url(#house)"/>
<path d="M18.6 21.8 L45.4 21.8" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
<path d="M16.2 31 L47.8 31" fill="none" stroke="#10151c" stroke-width="1.1"/>
<!-- the bell: steel that warms to bronze, its hoops, the light down its side -->
<path d="M19 32 L45 32 L50 50 Q32 54 14 50 Z" fill="url(#bell)"/>
<path d="M19 32 L45 32 L50 50 Q32 54 14 50 Z" fill="url(#warm)" stroke="none"/>
<path d="M18.67 37.5 Q32 39.7 45.33 37.5 M17.01 43.5 Q32 45.7 46.99 43.5" fill="none" stroke="#2b3440" stroke-width="1.1"/>
<path d="M21.4 34 L17.6 47.6" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3"/>
<!-- the exit and the fire in it -->
<ellipse cx="32" cy="50" rx="16" ry="3.2" fill="#160e0a" stroke-width="1.6"/>
<ellipse cx="32" cy="50.1" rx="13.6" ry="2.1" fill="url(#fire)" stroke="none"/>
</g>
<g id="accent" stroke="#10151c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<path d="M18 24.2 L46 24.2 L47.7 28.8 L16.3 28.8 Z" fill="url(#accent-fill)" stroke-width="1.3"/>
<path d="M18.4 25.5 L31 25.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8"/>
<circle cx="14" cy="16.6" r="1.8" fill="url(#accent-fill)" stroke-width="1"/><circle cx="50" cy="16.6" r="1.8" fill="url(#accent-fill)" stroke-width="1"/>
</g>
</svg>
