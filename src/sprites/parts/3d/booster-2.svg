<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
<linearGradient id="accent-fill" x1="0" y1="0" x2="1" y2="1"><stop id="accent-light" offset="0" stop-color="#ffa36b"/><stop id="accent-base" offset="0.55" stop-color="#e8743b"/><stop id="accent-dark" offset="1" stop-color="#9c4119"/></linearGradient>
<linearGradient id="house" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f7a87"/><stop offset="0.45" stop-color="#394350"/><stop offset="1" stop-color="#171c23"/></linearGradient>
<linearGradient id="bell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef2f6"/><stop offset="0.3" stop-color="#b3bdc8"/><stop offset="0.7" stop-color="#6b7684"/><stop offset="1" stop-color="#353e49"/></linearGradient>
<linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0.3" stop-color="#8a5a3a" stop-opacity="0"/><stop offset="1" stop-color="#7a4a2c" stop-opacity="0.85"/></linearGradient>
<radialGradient id="fire" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff1cf"/><stop offset="0.4" stop-color="#ffab52"/><stop offset="1" stop-color="#b3431c"/></radialGradient>
<linearGradient id="vane-l" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe5ec"/><stop offset="1" stop-color="#7b8795"/></linearGradient>
<linearGradient id="vane-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d99a6"/><stop offset="1" stop-color="#39434e"/></linearGradient>
</defs>
<g id="base" stroke="#10151c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<!-- a vane each side -->
<path d="M17 34 L9 46 L10 52 L16 46 Z" fill="url(#vane-l)"/>
<path d="M47 34 L55 46 L54 52 L48 46 Z" fill="url(#vane-r)"/>
<path d="M15.8 37.4 L10.4 45.6" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
<!-- the housing: its lip, a rib -->
<path d="M19 20 L45 20 L47 34 L17 34 Z" fill="url(#house)"/>
<path d="M20.6 21.8 L43.4 21.8" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
<path d="M18.2 31 L45.8 31" fill="none" stroke="#10151c" stroke-width="1.1"/>
<!-- the bell: steel that warms to bronze, its hoops, the light down its side -->
<path d="M21 32 L43 32 L48 50 Q32 54 16 50 Z" fill="url(#bell)"/>
<path d="M21 32 L43 32 L48 50 Q32 54 16 50 Z" fill="url(#warm)" stroke="none"/>
<path d="M20.67 37.5 Q32 39.7 43.33 37.5 M19.01 43.5 Q32 45.7 44.99 43.5" fill="none" stroke="#2b3440" stroke-width="1.1"/>
<path d="M23.4 34 L19.6 47.6" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.3"/>
<!-- the exit and the fire in it -->
<ellipse cx="32" cy="50" rx="14" ry="3.2" fill="#160e0a" stroke-width="1.6"/>
<ellipse cx="32" cy="50.1" rx="11.6" ry="2.1" fill="url(#fire)" stroke="none"/>
</g>
<g id="accent" stroke="#10151c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<path d="M20 24.2 L44 24.2 L45.7 28.8 L18.3 28.8 Z" fill="url(#accent-fill)" stroke-width="1.3"/>
<path d="M20.4 25.5 L31 25.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8"/>
</g>
</svg>
