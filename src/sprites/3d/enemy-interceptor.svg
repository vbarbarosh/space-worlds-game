<path d="M95 176.5 L96.5 174 L110 172.8 M142.6 176 L145.6 172.6 L159 173.9" fill="none" stroke="#8d99a6" stroke-width="1.3"/>
<path d="M90.5 188 L117.5 188 M90.5 194 L117.5 194 M90.5 217 L117.5 217 M165.5 188 L138.5 188 M165.5 194 L138.5 194 M165.5 217 L138.5 217" fill="none" stroke="#0e1318" stroke-width="1.6"/>
<path d="M92.6 185 L92.6 222 M140.6 185 L140.6 222" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.6"/>
<path d="M93.5 228 L114.5 228 L113 239 L95 239 Z" fill="url(#bell)" stroke-width="2.4"/>
