<ellipse cx="104" cy="237.2" rx="7.6" ry="2.7" fill="url(#nozzle)" stroke="none"/><ellipse cx="152" cy="237.2" rx="7.6" ry="2.7" fill="url(#nozzle)" stroke="none"/>
</g>
<g id="accent" stroke="#0e1318" stroke-width="3.2" stroke-linejoin="round">
