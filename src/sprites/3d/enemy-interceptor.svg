<path d="M90 202 L118 202 L118 211 L90 211 Z" fill="url(#accent-fill)" stroke-width="2.4"/>
<path d="M166 202 L138 202 L138 211 L166 211 Z" fill="url(#accent-fill)" stroke-width="2.4"/>
<path d="M92 90 L96 98 L102.5 96.4 L98.5 84 Z" fill="url(#accent-fill)" stroke-width="1.8"/>
<path d="M164 90 L160 98 L153.5 96.4 L157.5 84 Z" fill="url(#accent-fill)" stroke-width="1.8"/>
<path d="M122 133 L134 133 L134 139 L122 139 Z" fill="url(#accent-fill)" stroke-width="1.6"/>
</g>
<g id="lamps">
<circle cx="37.5" cy="124.5" r="4.5" fill="url(#lamp-red)"/><circle cx="218.5" cy="124.5" r="4.5" fill="url(#lamp-red)"/>
<circle cx="128" cy="220" r="4" fill="url(#lamp-red)"/>
</g>
<g id="anchors"><line id="flame-main-1" x1="104" y1="240" x2="104" y2="296" stroke="#ff0000" stroke-width="19" /><line id="flame-main-2" x1="152" y1="240" x2="152" y2="296" stroke="#ff0000" stroke-width="19" /></g>
</svg>
