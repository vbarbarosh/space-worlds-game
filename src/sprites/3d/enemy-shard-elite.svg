<path d="M128 30 L64.5 238 L76 232 L128 62 Z" fill="#ffffff" fill-opacity="0.36" stroke="none"/>
<path d="M128 30 L191.5 238 L180 232 L128 62 Z" fill="#05080c" fill-opacity="0.3" stroke="none"/>
<path d="M128 62 L76 232 M128 62 L180 232" fill="none" stroke="#1b2128" stroke-width="1.5"/>
<path d="M118 84 L138 84 L144 104 L140.5 123 L115.5 123 L112 104 Z" fill="url(#plate)" stroke-width="2.2"/>
<path d="M128 87 L129.5 120" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6"/>
<g fill="#2a313a" stroke="none"><circle cx="119.5" cy="88" r="1.3"/><circle cx="136.5" cy="88" r="1.3"/><circle cx="117" cy="119" r="1.3"/><circle cx="139" cy="119" r="1.3"/></g>
<!-- the elite's armour across the tail, bolted; then the core's ring -->
<path d="M88.2 173 L167.8 173 L178.4 204.9 L77.6 204.9 Z" fill="url(#dark)" stroke-width="2.6"/>
<path d="M90.5 176.5 L112 176.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
<g fill="#8d99a6" stroke="none"><circle cx="87.5" cy="190.3" r="1.5"/><circle cx="168.5" cy="190.3" r="1.5"/></g>
<circle cx="128" cy="151.9" r="23.5" fill="url(#dark)" stroke-width="2.6"/>
<g fill="#8d99a6" stroke="none"><circle cx="113.3" cy="137.2" r="1.4"/><circle cx="142.7" cy="137.2" r="1.4"/><circle cx="113.3" cy="166.6" r="1.4"/><circle cx="142.7" cy="166.6" r="1.4"/></g>
</g>
<g id="accent" stroke="#0e1318" stroke-width="3.2" stroke-linejoin="round">
<!-- the point, the core, a mark on each tail, the stripe on the elite's armour -->
<path d="M128 14 L146.5 75 L128 67 L109.5 75 Z" fill="url(#accent-fill)"/>
<path d="M127 27 L116.5 62.5 L121.5 62.5 Z" fill="#ffffff" fill-opacity="0.55" stroke="none"/>
<circle cx="128" cy="151.9" r="18" fill="url(#accent-fill)" stroke-width="2.4"/>
<path d="M116.5 147 A12.5 12.5 0 0 1 126 139.6" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
<path d="M67.5 225 L76 228 L70.5 234.5 L64.5 237.5 Z" fill="url(#accent-fill)" stroke-width="1.6"/>
<path d="M188.5 225 L180 228 L185.5 234.5 L191.5 237.5 Z" fill="url(#accent-fill)" stroke-width="1.6"/>
<path d="M98.8 183.7 L157.2 183.7 L159.8 196.9 L96.2 196.9 Z" fill="url(#accent-fill)" stroke-width="2.6"/>
<path d="M101.5 187 L128 187" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4"/>
</g>
<g id="lamps">
<circle cx="63.5" cy="238" r="4" fill="url(#lamp-red)"/><circle cx="192.5" cy="238" r="4" fill="url(#lamp-red)"/>
<circle cx="30.5" cy="90.5" r="4" fill="url(#lamp-red)"/><circle cx="225.5" cy="90.5" r="4" fill="url(#lamp-red)"/>
</g>
<g id="anchors"><line id="flame-main-1" x1="128" y1="226.09" x2="128" y2="310.93" stroke="#ff0000" stroke-width="31.81" /></g>
</svg>
