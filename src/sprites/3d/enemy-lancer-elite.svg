<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#cfd5dc"/><stop offset="0.4" stop-color="#8f99a4"/><stop offset="0.75" stop-color="#4c5560"/><stop offset="1" stop-color="#262c34"/>
</linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#e6eaef"/><stop offset="0.5" stop-color="#a3adb7"/><stop offset="1" stop-color="#454e58"/>
</linearGradient>
<linearGradient id="shadeV" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#05080c" stop-opacity="0.45"/>
</linearGradient>
<linearGradient id="bladeL" x1="1" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#aab3bd"/><stop offset="0.6" stop-color="#6c7682"/><stop offset="1" stop-color="#414a54"/>
</linearGradient>
<linearGradient id="bladeR" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7a848f"/><stop offset="0.6" stop-color="#48515b"/><stop offset="1" stop-color="#242a31"/>
</linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#5a6470"/><stop offset="0.5" stop-color="#363e48"/><stop offset="1" stop-color="#161b21"/>
</linearGradient>
<linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#474e58"/><stop offset="0.55" stop-color="#6a5445"/><stop offset="1" stop-color="#2a1a14"/>
</linearGradient>
<radialGradient id="nozzle" cx="0.5" cy="0.3" r="0.8">
<stop offset="0" stop-color="#fff1cf"/><stop offset="0.4" stop-color="#ffab52"/><stop offset="1" stop-color="#b3431c"/>
</radialGradient>
<linearGradient id="accent-fill" x1="0" y1="0" x2="1" y2="1">
<stop id="accent-light" offset="0" stop-color="#c8fffa"/><stop id="accent-base" offset="0.5" stop-color="#6cf8ec"/><stop id="accent-dark" offset="1" stop-color="#1f9c93"/>
</linearGradient>
<radialGradient id="lamp-red" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd6d0"/><stop offset="0.35" stop-color="#ff4a3d"/><stop offset="1" stop-color="#ff4a3d" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a9b2bc"/><stop offset="0.45" stop-color="#626c78"/><stop offset="1" stop-color="#252b33"/>
</linearGradient>
</defs>
<g id="hull" stroke="#0e1318" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
<!-- the fins: a notch in each trailing edge, a spar, a slot by the root -->
<path d="M110.7 149.6 L76 230.5 L87.6 242 L97.5 228.8 L94.5 222 L104.5 219.5 L113.6 207.4 Z" fill="url(#bladeL)"/>
<path d="M145.3 149.6 L180 230.5 L168.4 242 L158.5 228.8 L161.5 222 L151.5 219.5 L142.4 207.4 Z" fill="url(#bladeR)"/>
<path d="M107.5 166 L85 220 M148.5 166 L171 220" fill="none" stroke="#1b2128" stroke-width="1.8"/>
<path d="M109.2 167 L86.7 221" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
<path d="M104.5 188 L98.5 204.5 L102.5 206 L107.5 192 Z" fill="#11161c" stroke-width="1.5"/>
<path d="M151.5 188 L157.5 204.5 L153.5 206 L148.5 192 Z" fill="#0c1015" stroke-width="1.5"/>
<!-- the hull's shadow on the fins -->
<path d="M110 152 L100 190 L106 222 L116 222 Z M146 152 L156 190 L150 222 L140 222 Z" fill="#05080c" fill-opacity="0.34" stroke="none" filter="url(#soft)"/>
<!-- the elite's horns, forward of the shoulders: a notch, a rib -->
<path d="M118 90 L79 54.5 L92.5 82.5 L98 82 L100 96 L108.5 117 L114 117 Z" fill="url(#bladeL)"/>
<path d="M138 90 L177 54.5 L163.5 82.5 L158 82 L156 96 L147.5 117 L142 117 Z" fill="url(#bladeR)"/>
<path d="M108 100 L87.5 68 M148 100 L168.5 68" fill="none" stroke="#1b2128" stroke-width="1.8"/>
<!-- the lance: one long blade with a ridge, its right face in shade -->
<path d="M128 14 L136.5 60 L134.5 84 L121.5 84 L119.5 60 Z" fill="url(#steel)" stroke-width="2.4"/>
<path d="M128 16 L135.3 60 L133.5 82 L128 82 Z" fill="#05080c" fill-opacity="0.45" stroke="none"/>
<path d="M128 42 L128 72" fill="none" stroke="#1b2128" stroke-width="1.4"/>
<path d="M125.5 43 L122.5 60 L123.3 70" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
<!-- the engine: its bell with a rib, its fire -->
<path d="M115.5 224 L140.5 224 L138 242 L118 242 Z" fill="url(#bell)" stroke-width="2.4"/>
<path d="M117 235.5 L139 235.5" fill="none" stroke-width="1.5"/>
<ellipse cx="128" cy="239.3" rx="8" ry="2.4" fill="url(#nozzle)" stroke="none"/>
<!-- the hull; its dark prow, the lance's collar -->
<path d="M128 68.8 L145.3 97.7 L148.2 193 L139.5 230.5 L116.5 230.5 L107.8 193 L110.7 97.7 Z" fill="url(#body)"/>
<path d="M128 68.8 L145.3 97.7 L148.2 193 L139.5 230.5 L116.5 230.5 L107.8 193 L110.7 97.7 Z" fill="url(#shadeV)" stroke="none"/>
<path d="M128 68.8 L143 94 L113 94 Z" fill="url(#dark)" stroke-width="2.2"/>
<path d="M120.5 71 L135.5 71 L137 83 L119 83 Z" fill="url(#steel)" stroke-width="2.2"/>
<path d="M121.5 77 L134.5 77" fill="none" stroke-width="1.5"/>
<!-- gills beside the visor -->
<path d="M112.8 104 L117 104 M112.6 110.5 L117 110.5 M112.4 117 L117.5 117 M143.2 104 L139 104 M143.4 110.5 L139 110.5 M143.6 117 L138.5 117" fill="none" stroke-width="1.6"/>
<!-- the elite's collar: a band of armour round the waist, its plate, its bolts -->
<path d="M107 129.5 L149 129.5 L151.5 134.5 L151.5 147.5 L149 152.5 L107 152.5 L104.5 147.5 L104.5 134.5 Z" fill="url(#dark)"/>
<path d="M117 133.5 L139 133.5 L139 148.5 L117 148.5 Z" fill="url(#plate)" stroke-width="1.8"/>
<path d="M128 135.5 L129 146.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
<g fill="#8d99a6" stroke="none"><circle cx="110.5" cy="141" r="1.5"/><circle cx="145.5" cy="141" r="1.5"/></g>
<path d="M107.5 132.3 L114 132.3" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.1"/>
<path d="M112.5 213 Q128 217.5 143.5 213" fill="none" stroke="#1b2128" stroke-width="1.6"/>
<g fill="#2a313a" stroke="none"><circle cx="120" cy="222" r="1.3"/><circle cx="136" cy="222" r="1.3"/></g>
</g>
<g id="accent" stroke="#0e1318" stroke-width="3.2" stroke-linejoin="round">
<!-- the lance's point, the visor, the belt, the fins' tips, the elite's chevron -->
<path d="M128 14 L132.8 40 L123.2 40 Z" fill="url(#accent-fill)" stroke-width="2.2"/>
<path d="M119 100.5 L137 100.5 L135.5 113 L128 121.5 L120.5 113 Z" fill="url(#accent-fill)" stroke-width="2.4"/>
<path d="M122 103.5 L130 103.5 L125.5 108.5 Z" fill="#ffffff" fill-opacity="0.6" stroke="none"/>
<path d="M109.2 161 L146.8 161 L147.3 178.5 L108.7 178.5 Z" fill="url(#accent-fill)" stroke-width="2.6"/>
<path d="M112 164.5 L128 164.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
<path d="M76 230.5 L83.3 213.1 L94.5 222 L97.5 228.8 L87.6 242 Z" fill="url(#accent-fill)" stroke-width="2.6"/>
<path d="M180 230.5 L172.7 213.1 L161.5 222 L158.5 228.8 L168.4 242 Z" fill="url(#accent-fill)" stroke-width="2.6"/>
<path d="M116.5 193 L128 184.3 L139.5 193 L139.5 207.4 L128 198.7 L116.5 207.4 Z" fill="url(#accent-fill)" stroke-width="2.4"/>
</g>
<g id="lamps">
<circle cx="128" cy="89" r="4" fill="url(#lamp-red)"/>
<circle cx="82.5" cy="235.5" r="4" fill="url(#lamp-red)"/><circle cx="173.5" cy="235.5" r="4" fill="url(#lamp-red)"/>
<circle cx="81.5" cy="57" r="4" fill="url(#lamp-red)"/><circle cx="174.5" cy="57" r="4" fill="url(#lamp-red)"/>
</g>
<g id="anchors"><line id="flame-main-1" x1="128" y1="242" x2="128" y2="291.06" stroke="#ff0000" stroke-width="20.2" /></g>
</svg>
