<circle cx="22" cy="118" r="5" fill="url(#accent-fill)" stroke-width="2.5"/><circle cx="234" cy="118" r="5" fill="url(#accent-fill)" stroke-width="2.5"/>
<circle cx="128" cy="150" r="9" fill="url(#accent-fill)" stroke-width="3"/>
</g>
<g id="anchors"><circle id="sensor" cx="128" cy="74" r="6" fill="#0000ff"/><line id="flame-main-1" x1="98" y1="226" x2="98" y2="252" stroke="#ff0000" stroke-width="18"/><line id="flame-main-2" x1="158" y1="226" x2="158" y2="252" stroke="#ff0000" stroke-width="18"/></g>
</svg>
