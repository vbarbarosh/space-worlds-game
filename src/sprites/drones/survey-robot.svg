<rect x="112" y="86" width="32" height="32" fill="url(#gun)"/>
<circle cx="128" cy="74" r="48" fill="url(#dish)"/>
<circle cx="128" cy="74" r="40.5" fill="none" stroke="#3b4652" stroke-opacity="0.7" stroke-width="2.5"/>
<path d="M143 74 L167 74 M135.5 86.99 L147.5 107.77 M120.5 86.99 L108.5 107.77 M113 74 L89 74 M120.5 61.01 L108.5 40.23 M135.5 61.01 L147.5 40.23" fill="none" stroke="#6b7684" stroke-width="3"/>
<path d="M171.63 81.69 A44.3 44.3 0 0 1 135.69 117.63" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
