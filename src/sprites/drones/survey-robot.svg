<circle cx="128" cy="150" r="22" fill="#c5ccd5" stroke-width="4"/>
<path d="M110.57 148.47 A17.5 17.5 0 0 1 126.47 132.57" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5"/>
</g>
<g id="accent" stroke="#10151c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
<!-- the dish's feed, the ring's lamps, the pods' lenses, the hatch's eye -->
<circle cx="128" cy="74" r="11" fill="url(#accent-fill)" stroke-width="3.5"/>
<circle cx="124" cy="70" r="3.5" fill="#ffffff" fill-opacity="0.8" stroke="none"/>
