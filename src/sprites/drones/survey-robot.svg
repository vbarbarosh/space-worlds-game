<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
<linearGradient id="accent-fill" x1="0" y1="0" x2="1" y2="1"><stop id="accent-light" offset="0" stop-color="#a7f1ff"/><stop id="accent-base" offset="0.5" stop-color="#5fe6ff"/><stop id="accent-dark" offset="1" stop-color="#398a99"/></linearGradient>
<radialGradient id="plate" cx="0.35" cy="0.32" r="0.8"><stop offset="0" stop-color="#f7fafc"/><stop offset="0.5" stop-color="#b9c2cc"/><stop offset="1" stop-color="#56616e"/></radialGradient>
<linearGradient id="dish" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f6b78"/><stop offset="0.55" stop-color="#c5ccd5"/><stop offset="1" stop-color="#f2f5f8"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f7a87"/><stop offset="0.5" stop-color="#394350"/><stop offset="1" stop-color="#171c23"/></linearGradient>
<linearGradient id="gun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f7a87"/><stop offset="0.45" stop-color="#394350"/><stop offset="1" stop-color="#171c23"/></linearGradient>
<linearGradient id="bell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b525c"/><stop offset="0.55" stop-color="#6d5646"/><stop offset="1" stop-color="#2a1a14"/></linearGradient>
<radialGradient id="fire" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff1cf"/><stop offset="0.4" stop-color="#ffab52"/><stop offset="1" stop-color="#b3431c"/></radialGradient>
</defs>
<g id="hull" stroke="#10151c" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
<!-- two arms, a sensor pod on each -->
<path d="M78 150 L24 120 M178 150 L232 120" fill="none" stroke-width="15"/>
<path d="M78 150 L24 120 M178 150 L232 120" fill="none" stroke="#77838f" stroke-width="7"/>
<path d="M74 145.5 L27 119.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5"/>
<circle cx="22" cy="118" r="11" fill="url(#plate)" stroke-width="4.5"/><circle cx="234" cy="118" r="11" fill="url(#plate)" stroke-width="4.5"/>
<!-- two engines: housing, bell, fire -->
<rect x="88" y="200" width="20" height="16" fill="url(#gun)"/><rect x="148" y="200" width="20" height="16" fill="url(#gun)"/>
<path d="M89 213 L107 213 L105 225 L91 225 Z M149 213 L167 213 L165 225 L151 225 Z" fill="url(#bell)" stroke-width="4.5"/>
<ellipse cx="98" cy="222.5" rx="6" ry="2.6" fill="url(#fire)" stroke="none"/><ellipse cx="158" cy="222.5" rx="6" ry="2.6" fill="url(#fire)" stroke="none"/>
