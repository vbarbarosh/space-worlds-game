<circle cx="128" cy="150" r="66" fill="url(#plate)"/>
<circle cx="128" cy="150" r="54" fill="none" stroke-width="13"/>
<circle cx="128" cy="150" r="54" fill="none" stroke="url(#ring)" stroke-width="8"/>
<path d="M74.74 180.75 A61.5 61.5 0 0 1 72.26 124.01" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
