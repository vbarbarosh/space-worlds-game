<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · World Explorer docs</title>
<script>
// Light or dark, stamped before the first paint: the stored choice, else the system's once
(function () {
    let theme = null;
    try {
        theme = localStorage.getItem('docs_theme');
    }
    catch {
    }
    if ((theme !== 'light') && (theme !== 'dark')) {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="preload" href="{{root}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/docs.css">
<link rel="icon" href="{{root}}assets/logo.svg" type="image/svg+xml">
</head>
<body id="top">
<a class="skip" href="#content">Skip to the article</a>
<header class="bar">
    <div class="bar-in">
        <a class="brand" href="{{root}}index.html" aria-label="World Explorer docs, home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">World Explorer</span>
            <span class="brand-tag">Docs</span>
        </a>
        <details class="picker">
            <summary><span class="picker-label">Pages</span><span class="picker-title">{{title}}</span></summary>
            <nav class="picker-list" aria-label="Pages">
{{nav}}
            </nav>
        </details>
        <span class="space"></span>
        <!-- the game itself, copied into play/ by bin/build-docs -->
        <a class="bar-link play" href="{{root}}play/index.html"><span>Play</span></a>
        <a class="bar-link repo" href="https://github.com/vbarbarosh/space-worlds-game" aria-label="GitHub"><span>GitHub</span></a>
        <span class="theme" role="group" aria-label="Theme"><button type="button" data-value="light" aria-label="Light"><span>Light</span></button><button type="button" data-value="dark" aria-label="Dark"><span>Dark</span></button></span>
    </div>
</header>
<div class="hero" aria-hidden="true"></div>
<div class="layout">
    <nav class="pages" aria-label="Pages">
        <div class="pages-label">Pages</div>
{{nav}}
    </nav>
    <main id="content">
        <article class="content">
{{content}}
        </article>
    </main>
</div>
<footer class="foot">
    <div class="foot-in">
        <div class="foot-brand"><span class="brand-mark" aria-hidden="true"></span><span>World Explorer docs</span></div>
        <p class="foot-text">Built from <code>docs/*.md</code> by <code>bin/build-docs</code>. Each page names the code it describes.</p>
        <span class="space"></span>
        <a class="foot-link repo" href="https://github.com/vbarbarosh/space-worlds-game/tree/main/docs">Source on GitHub</a>
        <a class="foot-link up" href="#top">Back to top</a>
    </div>
</footer>
<script>
for (const v of document.querySelectorAll('.theme button')) {
    v.addEventListener('click', function () {
        document.documentElement.dataset.theme = v.dataset.value;
        try {
            localStorage.setItem('docs_theme', v.dataset.value);
        }
        catch {
        }
    });
}
</script>
</body>
</html>
