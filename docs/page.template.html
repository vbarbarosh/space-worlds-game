<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · World Explorer docs</title>
<script>
// Light or dark, stamped before the first paint: the stored choice, else the system's once
(function () {
    let theme = null;
    try {
        theme = localStorage.getItem('docs_theme');
    }
    catch {
    }
    if ((theme !== 'light') && (theme !== 'dark')) {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="preload" href="{{root}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/docs.css">
<link rel="icon" href="{{root}}assets/logo.svg" type="image/svg+xml">
</head>
<body id="top">
<a class="skip" href="#content">Skip to the article</a>
<header class="bar">
    <div class="bar-in">
        <a class="brand" href="{{root}}index.html" aria-label="World Explorer docs, home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">World Explorer</span>
            <span class="brand-tag">Docs</span>
        </a>
        <details class="picker">
            <summary><span class="picker-label">Pages</span><span class="picker-title">{{title}}</span></summary>
            <nav class="picker-list" aria-label="Pages">
{{nav}}
            </nav>
        </details>
        <span class="space"></span>
        <!-- the game itself, copied into play/ by bin/build-docs -->
        <a class="bar-link play" href="{{root}}play/index.html"><span>Play</span></a>
        <a class="bar-link repo" href="https://github.com/vbarbarosh/space-worlds-game" aria-label="GitHub" title="GitHub"><span>GitHub</span></a>
        <!-- one button showing the theme now: the sun in Light, the crescent in Dark; the rulebook's shared icons -->
        <button type="button" class="theme" aria-label="Dark theme. Switch to light theme."><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12,9c1.65,0,3,1.35,3,3s-1.35,3-3,3s-3-1.35-3-3S10.35,9,12,9 M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5 S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1 s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1C11.45,19,11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0 c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95 c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41 L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41 s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06 c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"/></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M9.37,5.51C9.19,6.15,9.1,6.82,9.1,7.5c0,4.08,3.32,7.4,7.4,7.4c0.68,0,1.35-0.09,1.99-0.27C17.45,17.19,14.93,19,12,19 c-3.86,0-7-3.14-7-7C5,9.07,6.81,6.55,9.37,5.51z M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36 c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z"/></svg></button>
    </div>
</header>
<div class="hero" aria-hidden="true"></div>
<div class="layout">
    <nav class="pages" aria-label="Pages">
        <div class="pages-label">Pages</div>
{{nav}}
    </nav>
    <main id="content">
        <article class="content">
{{content}}
        </article>
    </main>
</div>
<footer class="foot">
    <div class="foot-in">
        <div class="foot-brand"><span class="brand-mark" aria-hidden="true"></span><span>World Explorer docs</span></div>
        <p class="foot-text">Built from <code>docs/*.md</code> by <code>bin/build-docs</code>. Each page names the code it describes.</p>
        <span class="space"></span>
        <a class="foot-link repo" href="https://github.com/vbarbarosh/space-worlds-game/tree/main/docs">Source on GitHub</a>
        <a class="foot-link up" href="#top">Back to top</a>
    </div>
</footer>
<script>
const theme_button = document.querySelector('.theme');
theme_button_refresh();
theme_button.addEventListener('click', function () {
    const theme = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    theme_button_refresh();
    try {
        localStorage.setItem('docs_theme', theme);
    }
    catch {
    }
});

function theme_button_refresh()
{
    theme_button.setAttribute('aria-label', (document.documentElement.dataset.theme === 'dark') ? 'Dark theme. Switch to light theme.' : 'Light theme. Switch to dark theme.');
}
</script>
</body>
</html>
