# The documentation site, with the game in play/: bin/build and bin/build-docs on every push to main, published to
# GitHub Pages
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job reads the repository and no more; the right to publish is the deploy job's alone, so nothing that
# `npm ci` brings in runs with it. Each action is named by its commit, the version beside it: a tag can be moved
permissions:
  contents: read

# One deploy at a time. A deploy in flight is left to finish and the newest waiting one follows it: a deploy cancelled
# half way can leave the next one waiting until it times out
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bin/build
      - run: bin/build-docs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
