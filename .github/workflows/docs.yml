# The documentation site, with the game in play/: bin/build and bin/build-docs on every push to main, published to
# GitHub Pages
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job reads the repository and no more; the right to publish is the deploy job's alone, so nothing that
# `npm ci` brings in runs with it. Each action is named by its commit, the version beside it: a tag can be moved
permissions:
  contents: read

# One deploy at a time. A deploy in flight is left to finish and the newest waiting one follows it: a deploy cancelled
# half way can leave the next one waiting until it times out
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: bin/build
      - run: bin/build-docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
